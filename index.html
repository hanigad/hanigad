<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تنبيه إغلاق الهاتف المحمول</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-1: #0f172a;
      --bg-2: #040b17;
      --accent: #f97316;
      --alert-red: #ef4444;
      --glass: rgba(15, 23, 42, 0.65);
      --text-primary: #f8fafc;
      --text-secondary: #d1d5f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Tajawal", "Cairo", "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(2rem, 4vw, 5rem);
      background:
        radial-gradient(circle at 18% 22%, rgba(239, 68, 68, 0.22), transparent 58%),
        radial-gradient(circle at 82% 16%, rgba(249, 115, 22, 0.14), transparent 64%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      overflow: hidden;
      color: var(--text-primary);
    }

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particles span {
      position: absolute;
      display: block;
      width: 12px;
      height: 12px;
      background: rgba(239, 68, 68, 0.45);
      border-radius: 50%;
      filter: blur(2px);
      animation: float 18s linear infinite;
    }

    .particles span:nth-child(n) {
      top: calc(var(--i) * 4%);
      left: calc(var(--i) * 5%);
      animation-duration: calc(14s + var(--i) * 0.7s);
      animation-delay: calc(var(--i) * -0.8s);
    }

    @keyframes float {
      0% {
        transform: translate3d(0, 0, 0) scale(0.75);
        opacity: 0.15;
      }
      50% {
        opacity: 0.35;
      }
      100% {
        transform: translate3d(0, -200px, 0) scale(1.1);
        opacity: 0.08;
      }
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(1.6rem, 3vw, 2.6rem);
      width: min(78vw, 1080px);
      max-width: 1080px;
      padding: clamp(3rem, 5vw, 4.5rem);
      border-radius: clamp(32px, 4vw, 52px);
      background: var(--glass);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        0 50px 120px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      text-align: center;
      overflow: hidden;
      animation: reveal 1.1s ease-out both;
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      inset: -40%;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.22), transparent 65%);
      animation: spin 22s linear infinite;
      mix-blend-mode: screen;
    }

    .card::after {
      animation-direction: reverse;
      animation-duration: 28s;
    }

    @media (min-width: 1200px) {
      .card {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: clamp(3rem, 5vw, 4rem);
        padding: clamp(3.5rem, 4.5vw, 5rem) clamp(4rem, 6vw, 6.5rem);
        text-align: right;
      }
    }

    @keyframes reveal {
      0% {
        transform: translateY(70px) scale(0.94);
        opacity: 0;
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .pulse-ring {
      position: absolute;
      inset: -6px;
      border-radius: inherit;
      border: 1px solid rgba(239, 68, 68, 0.2);
      animation: pulse 3.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 0.65;
        transform: scale(1);
      }
      70% {
        opacity: 0;
        transform: scale(1.08);
      }
      100% {
        opacity: 0;
        transform: scale(1);
      }
    }

    .icon-wrapper {
      width: clamp(240px, 28vw, 360px);
      position: relative;
      margin: 0;
    }

    @media (max-width: 1199px) {
      .icon-wrapper {
        margin-bottom: clamp(1.5rem, 3vw, 2rem);
      }
    }

    .icon-wrapper svg {
      width: 100%;
      height: auto;
      filter:
        drop-shadow(0 16px 36px rgba(239, 68, 68, 0.35))
        drop-shadow(0 0 26px rgba(249, 115, 22, 0.35));
      animation: bob 3.6s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-14px);
      }
    }

    .text-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(0.6rem, 1.6vw, 1.4rem);
      max-width: 560px;
      width: 100%;
    }

    @media (min-width: 1200px) {
      .text-block {
        align-items: flex-end;
        max-width: clamp(520px, 44vw, 640px);
      }
    }

    h1 {
      font-size: clamp(2.1rem, 3.6vw, 3.5rem);
      margin-bottom: clamp(0.6rem, 2vw, 1.2rem);
      font-weight: 700;
      letter-spacing: 0.6px;
    }

    @media (min-width: 1200px) {
      h1 {
        font-size: clamp(2.6rem, 3vw + 1rem, 3.9rem);
        align-self: stretch;
      }
    }

    p {
      font-size: clamp(1.1rem, 2.2vw, 1.5rem);
      line-height: 2;
      color: var(--text-secondary);
      max-width: 88ch;
      margin: 0;
    }

    @media (min-width: 1200px) {
      p {
        align-self: stretch;
      }
    }

    .highlight {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.42rem 1.8rem;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.18);
      color: var(--alert-red);
      font-weight: 600;
      letter-spacing: 0.65px;
      animation: blink 3s ease-in-out infinite;
      font-size: clamp(2rem, 4vw, 3.6rem);
      line-height: 1.5;
      text-align: center;
    }

    @media (min-width: 1200px) {
      .highlight {
        align-self: flex-end;
        text-align: right;
      }
    }

    .reference {
      align-self: flex-start;
      font-size: clamp(1.1rem, 2vw, 1.6rem);
      color: var(--text-secondary);
      margin-bottom: clamp(0.8rem, 1.8vw, 1.4rem);
      text-align: left;
      direction: ltr;
    }

    @media (min-width: 1200px) {
      .reference {
        margin-inline-start: 0;
      }
    }

    @keyframes blink {
      0%, 100% {
        opacity: 0.82;
      }
      50% {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="particles" aria-hidden="true">
    <span style="--i:1;"></span>
    <span style="--i:3;"></span>
    <span style="--i:5;"></span>
    <span style="--i:7;"></span>
    <span style="--i:9;"></span>
    <span style="--i:11;"></span>
    <span style="--i:13;"></span>
    <span style="--i:15;"></span>
    <span style="--i:17;"></span>
    <span style="--i:19;"></span>
    <span style="--i:2;"></span>
    <span style="--i:4;"></span>
    <span style="--i:6;"></span>
    <span style="--i:8;"></span>
    <span style="--i:10;"></span>
    <span style="--i:12;"></span>
    <span style="--i:14;"></span>
    <span style="--i:16;"></span>
    <span style="--i:18;"></span>
    <span style="--i:20;"></span>
  </div>

  <main class="card" role="alert">
    <span class="pulse-ring" aria-hidden="true"></span>

    <div class="icon-wrapper" aria-hidden="true">
      <svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1f2937" />
            <stop offset="100%" stop-color="#0f172a" />
          </linearGradient>
          <linearGradient id="screenGlow" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="rgba(148, 163, 184, 0.55)" />
            <stop offset="100%" stop-color="rgba(30, 41, 59, 0.92)" />
          </linearGradient>
          <radialGradient id="phoneAura" cx="50%" cy="10%" r="80%">
            <stop offset="0%" stop-color="rgba(239, 68, 68, 0.35)" />
            <stop offset="100%" stop-color="rgba(249, 115, 22, 0.08)" />
          </radialGradient>
        </defs>

        <circle cx="130" cy="116" r="108" fill="url(#phoneAura)" opacity="0.45" />

        <g transform="translate(60 28) scale(1.28)" opacity="0.96">
          <rect x="0" y="0" width="110" height="190" rx="24" fill="url(#phoneBody)" stroke="#111827" stroke-width="4" />
          <rect x="12" y="22" width="86" height="138" rx="18" fill="url(#screenGlow)" />
          <rect x="38" y="168" width="34" height="10" rx="5" fill="#111827" />
          <circle cx="55" cy="14" r="5" fill="#475569" />
        </g>

        <circle cx="130" cy="130" r="76" fill="rgba(239, 68, 68, 0.20)" stroke="var(--alert-red)" stroke-width="18" opacity="0.92" />

        <line x1="62" y1="198" x2="198" y2="62" stroke="var(--alert-red)" stroke-width="20" stroke-linecap="round" />
      </svg>
    </div>

    <div class="text-block">
      <div class="highlight">بِبَيْتِكَ تَلِيقُ الْقَدَاسَةُ يَا رَبُّ إِلَى طُولِ الأَيَّامِ.</div>
      <div class="reference">مز 93: 5</div>
      <h1>من فضلك أغلق التليفون المحمول</h1>
      <p>
        للمحافظة على روحانية القداس وتركيز الحضور، نرجو منك إيقاف تشغيل الهاتف أو ضبطه على الوضع الصامت فوراً. شكراً لتعاونك الكريم.
      </p>
    </div>
  </main>
</body>
</html>
